[manifest]
version = "1.0.0"
dump_lua = true
priority = 1000

[[patches]]
[patches.pattern]
target = "main.lua"
pattern = "G:start_up()"
position = "before"
payload = "love.filesystem.setIdentity('Balatro-JRC-QA', true)"
match_indent = true

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "self.SETTINGS.version = settings_ver or G.VERSION"
position = "before"
payload = "self.SETTINGS.language = 'ko'; self.SETTINGS.real_language = 'ko'"
match_indent = true

[[patches]]
[patches.pattern]
target = "main.lua"
pattern = "if os == 'OS X' or os == 'Windows' then"
position = "at"
payload = "if false then -- Isolated QA: do not submit Steam stats or achievements."
match_indent = true
